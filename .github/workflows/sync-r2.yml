name: 同步 R2 运动归档

# 归档完整性与 GitHub 实跑验收通过后，接替原 Strava 定时同步。
on:
  schedule:
    # 每天 21:40 UTC（次日 05:40 北京时间）
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 忽略增量状态，重新校验全部归档对象
        type: boolean
        default: false

# 只需要写权限：跑完把数据产物和同步状态提交回仓库
permissions:
  contents: write

# 与微信读书、旧 Strava 同步共用并发组，避免同时推 main 冲突
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，不要重复指定 version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 解析与去重单元测试
        run: pnpm test

      - name: 从 R2 导入运动数据
        # 只读凭据只在当前步骤可见，脚本不打印凭据、对象键或对象内容
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          R2_SYNC_TIMEZONE: Asia/Shanghai
        run: pnpm sync-r2 ${{ inputs.full == true && '--full' || '' }}

      - name: 提交数据与状态变更
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/strava public/strava
          if git diff --cached --quiet; then
            echo '数据没有变化，跳过提交'
            exit 0
          fi
          git commit -m "chore(sport): 同步 R2 运动归档（$(date -u +%F)）"
          # 并发组内其它任务可能刚推过 main，先变基再推；冲突时失败退出，绝不强推
          git pull --rebase --autostash
          git push

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::R2 运动归档导入失败。若日志提示归档索引缺失、不完整或 failedIds 非空，请先完成归档再重跑；若提示凭据缺失，请检查 R2_* secrets。"
